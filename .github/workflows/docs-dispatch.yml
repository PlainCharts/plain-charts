name: Publish docs

# When the docs sources change, tell the plaincharts.github.io repo to rebuild
# and publish both sites. That repo owns Pages (its name is the org root host);
# this repo owns the sources. A cross-repo trigger needs a token the default
# GITHUB_TOKEN can't provide -- store a fine-grained PAT as the DOCS_DEPLOY_TOKEN
# secret (repo: plaincharts.github.io, Contents: read/write).
on:
  push:
    branches: [main]
    paths:
      - 'docs/web/**'
      - 'docs/kapelka/**'
      - 'lib/kapelka/**'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs deploy
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.DOCS_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/PlainCharts/plaincharts.github.io/dispatches \
            -d '{"event_type":"docs-updated"}'
