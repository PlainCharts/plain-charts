name: Check Pacman catalog

# Pacman browses <repo>/main/index.json, and raw.githubusercontent.com can't list folders -- so the
# catalog must match the packages in the SAME commit. It is regenerated LOCALLY by the pre-commit hook
# (.githooks/pre-commit), never here. This job is a read-only GATE: it regenerates and fails if the
# committed index.json is stale, so a bad commit can't slip through.
#
# It does NOT commit anything. A CI job that committed index.json back to main would add commits your
# local doesn't have, turning every next push into a rejected non-fast-forward -- the wall we removed.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'addons/**'
      - 'data_engine/adapters/**'
      - 'static/locale/**'
      - 'scripts/catalog-index.mjs'
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacman-catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify index.json is current
        run: |
          node scripts/catalog-index.mjs
          if ! git diff --quiet -- index.json; then
            echo "::error::index.json is stale. Regenerate it: 'node scripts/catalog-index.mjs' and commit."
            echo "The pre-commit hook (.githooks/pre-commit) does this automatically; run 'git config core.hooksPath .githooks' if a fresh clone."
            git --no-pager diff --stat -- index.json
            exit 1
          fi
          echo "Catalog is current."
