# Skill: "Short words over long." / "Cut before you rewrite."
extends: substitution
message: "Wordy — use '%s' instead of '%s'."
level: warning
ignorecase: true
action:
  name: replace
swap:
  in order to: to
  due to the fact that: because
  for the purpose of: to
  in the event that: if
  at this point in time: now
  at the present time: now
  a number of: several
  the majority of: most
  on a daily basis: daily
  on a regular basis: regularly
  in many cases: often
  in some cases: sometimes
  in most cases: usually
  is able to: can
  are able to: can
  was able to: could
  were able to: could
  has the ability to: can
  have the ability to: can
  prior to: before
  subsequent to: after
  with regard to: about
  in regard to: about
  with respect to: about
  regarding the: about the
  pertaining to: about
  in accordance with: under
  in conjunction with: with
  in addition to: besides
  as well as: and
  whether or not: whether
  in order that: so
  so as to: to
  for the reason that: because
  by means of: by
  in the process of: while
  make use of: use
  made use of: used
  make use: use
  utilize: use
  utilizes: uses
  utilized: used
  utilizing: using
  leverage: use
  leverages: uses
  implement: carry out
  commence: begin
  terminate: end
  endeavor: try
  obtain: get
  procure: get
  assist: help
  demonstrate: show
  approximately: about
  sufficient: enough
  numerous: many
  individual: person
  purchase: buy
  inquire: ask
  modification: change
  facilitate: help
  indicate: show
  additional: more
  initial: first
  final: last
  therefore: so
  however: but