<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSI on the bottom overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d1d4dc; overflow: hidden; }
    #chart { height: 100%; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script type="module">
    // An RSI placed on the BOTTOM of the price pane, on its own overlay scale (axisId + margins) -- the
    // same mechanism the volume region uses, open to any study. Theme is taken from the demos' shared
    // settings.json (the same one studies.html uses).
    import { mountChart, Candles, Line } from '/index.js';
    import { generateBars, computeRSI } from '/examples/feed.js';

    const s = await fetch('/examples/settings.json').then((r) => r.json()).catch(() => ({}));
    const cx = s.crosshair || { color: '#6a6d78', style: 1, labelBg: '#2a2e39', labelText: '#ffffff' };
    const rsiCfg = s.rsi || { period: 14, color: '#ff8800', overbought: 70, oversold: 30, guideColor: '#b2b5be' };

    const bars = generateBars({ count: 400, seed: 7, step: 300 });

    const chart = mountChart(document.getElementById('chart'), {
      layout: { background: { color: s.background || '#d1d4dc' }, textColor: s.textColor || '#50535e' },
      grid: { vertLines: { visible: false }, horzLines: { visible: false } },
      cursor: { color: cx.color, labelBg: cx.labelBg, labelText: cx.labelText, vertLine: { style: cx.style }, horzLine: { style: cx.style } },
      timeAxis: { borderColor: s.borderColor || '#b2b5be', timeVisible: true, indexBased: true },
      rightPriceAxis: { borderColor: s.borderColor || '#b2b5be', margins: { top: 0.05, bottom: 0.3 } },   // leave the bottom for the RSI
      maxZoom: 3000,
    });

    const candles = chart.addPlot(Candles, s.candles || {
      upColor: '#5b9c7b', downColor: '#2a2e39', borderUpColor: '#3a3e48', borderDownColor: '#3a3e48', wickUpColor: '#3a3e48', wickDownColor: '#3a3e48',
    }, 0);
    candles.feed(bars.map(({ volume, ...b }) => b));

    // RSI on its OWN overlay scale, pinned to the bottom region of the SAME pane
    const rsi = chart.addPlot(Line, {
      color: rsiCfg.color, lineWidth: 1.5,
      axisId: 'rsi', margins: { top: 0.72, bottom: 0.04 },
    }, 0);
    rsi.feed(computeRSI(bars, rsiCfg.period || 14));
    try {
      rsi.addLevel({ price: rsiCfg.overbought || 70, color: rsiCfg.guideColor || '#b2b5be', lineWidth: 1, lineStyle: 2, showLine: true });
      rsi.addLevel({ price: rsiCfg.oversold || 30, color: rsiCfg.guideColor || '#b2b5be', lineWidth: 1, lineStyle: 2, showLine: true });
    } catch (_) {}

    chart.timeAxis().setBarWindow({ from: Math.max(0, bars.length - 160), to: bars.length - 1 + 4 });
  </script>
</body>
</html>
