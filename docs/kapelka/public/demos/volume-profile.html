<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volume profile on the price axis</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d1d4dc; overflow: hidden; }
    #chart { height: 100%; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script type="module">
    // A volume profile: horizontal 'hbar' bars anchored to PRICE levels, not to time. The volume_profile
    // study buckets the visible range into price rows, splits each row into up/down segments, and feeds
    // them as horizontal bars the engine draws against the price (Y) axis. Theme from the demos' shared
    // settings.json (the same one studies.html uses). Engine mirrored into public/ by mirror-engine.mjs.
    import { mountChart, Candles } from '../index.js';
    import { StudyHost } from '../studies/index.js';
    import '../studies/modules/index.js';   // registers the gallery, including volume_profile

    const s = await fetch('../examples/settings.json').then((r) => r.json()).catch(() => ({}));
    const cx = s.crosshair || { color: '#6a6d78', style: 1, labelBg: '#2a2e39', labelText: '#ffffff' };

    const { generateBars } = await import('../examples/feed.js');
    const bars = generateBars({ count: 400, seed: 7, step: 300 });

    const chart = mountChart(document.getElementById('chart'), {
      layout: { background: { color: s.background || '#d1d4dc' }, textColor: s.textColor || '#50535e' },
      grid: { vertLines: { visible: false }, horzLines: { visible: false } },
      cursor: { color: cx.color, labelBg: cx.labelBg, labelText: cx.labelText, vertLine: { style: cx.style }, horzLine: { style: cx.style } },
      timeAxis: { borderColor: s.borderColor || '#b2b5be', timeVisible: true, indexBased: true },
      rightPriceAxis: { borderColor: s.borderColor || '#b2b5be' },
      maxZoom: 3000,
    });

    const candles = chart.addPlot(Candles, s.candles || {
      upColor: '#5b9c7b', downColor: '#2a2e39', borderUpColor: '#3a3e48', borderDownColor: '#3a3e48', wickUpColor: '#3a3e48', wickDownColor: '#3a3e48',
    }, 0);
    candles.feed(bars);
    chart.timeAxis().setBarWindow({ from: Math.max(0, bars.length - 160), to: bars.length - 1 + 4 });

    // the volume profile is a study that feeds an 'hbar' series onto the price axis of the same pane
    const host = new StudyHost(chart, {
      getBars: () => bars,
      mainSeries: () => candles,
      barTimes: () => bars.map((b) => b.time),
    });
    host.setData(bars);
    host.add('volume_profile', { lookback: 150, rows: 24, width: 30, side: 'right' });
  </script>
</body>
</html>
