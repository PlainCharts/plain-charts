<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A custom lollipop series (addCustomPlot)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d1d4dc; overflow: hidden; }
    #chart { height: 100%; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script type="module">
    // A LOLLIPOP series -- a stem from the zero line with a filled circle at its tip -- drawn entirely by
    // the caller through addCustomPlot. None of the seven built-in types draw this; the renderer lives
    // here, and the engine feeds it data, places it in the pane, auto-scales it (via priceValues) and
    // reports it under the crosshair, exactly like a built-in. Theme from the demos' shared settings.json.
    import { mountChart } from '../index.js';

    const s = await fetch('../examples/settings.json').then((r) => r.json()).catch(() => ({}));
    const cx = s.crosshair || { color: '#6a6d78', style: 1, labelBg: '#2a2e39', labelText: '#ffffff' };
    const cd = s.candles || {};
    const upCol = cd.upColor || '#5b9c7b', downCol = cd.downColor || '#2a2e39';

    const { generateBars } = await import('../examples/feed.js');
    const bars = generateBars({ count: 400, seed: 7, step: 300 });
    // momentum: percent change of close over a lookback -> the lollipop values (swings above/below zero)
    const LB = 10;
    const momentum = bars.slice(LB).map((b, i) => {
      const base = bars[i].close;   // bars[(i+LB)-LB] == bars[i]
      return { time: b.time, value: base ? ((b.close - base) / base) * 100 : 0 };
    });

    const chart = mountChart(document.getElementById('chart'), {
      layout: { background: { color: s.background || '#d1d4dc' }, textColor: s.textColor || '#50535e' },
      grid: { vertLines: { visible: false }, horzLines: { visible: false } },
      cursor: { color: cx.color, labelBg: cx.labelBg, labelText: cx.labelText, vertLine: { style: cx.style }, horzLine: { style: cx.style } },
      timeAxis: { borderColor: s.borderColor || '#b2b5be', timeVisible: true, indexBased: true },
      rightPriceAxis: { borderColor: s.borderColor || '#b2b5be', margins: { top: 0.1, bottom: 0.1 } },
      maxZoom: 3000,
    });

    // the whole custom series: two functions (priceValues + draw). The engine drives it.
    const lolli = chart.addCustomPlot({
      priceValues: (pt) => [pt.value, 0],          // include the baseline 0 in the auto-scale
      draw({ ctx, data, priceToY, width, options }) {
        const y0 = priceToY(0);
        ctx.strokeStyle = 'rgba(120,123,134,0.5)';                             // zero line
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(width, y0); ctx.stroke();
        ctx.lineWidth = 1.5;
        for (const { x, point } of data) {
          const y = priceToY(point.value);
          ctx.strokeStyle = ctx.fillStyle = point.value >= 0 ? options.up : options.down;
          ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y); ctx.stroke();   // stem
          ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI); ctx.fill();        // head
        }
      },
    }, { up: upCol, down: downCol }, 0);
    lolli.feed(momentum);

    chart.timeAxis().setBarWindow({ from: Math.max(0, momentum.length - 160), to: momentum.length - 1 + 4 });
  </script>
</body>
</html>
