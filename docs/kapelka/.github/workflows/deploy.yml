name: Deploy to GitHub Pages

# Build the Astro site on every push to main and publish it to GitHub Pages.
# Runs the package "build" script (astro build + pagefind search index) on a clean
# runner, so the local npm optional-deps issue never applies here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# least-privilege token: read the repo, write Pages, mint the OIDC token deploy-pages needs
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push supersedes an in-flight run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
