<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart — CQG live</title>
  <!-- App styles, split by subsystem (see css/). Loaded in this order so base.css defines the
       :root theme vars first; theme.js then overrides those vars at runtime on documentElement.
       Link order == original source order, so the effective cascade is unchanged. -->
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/menus.css" />
  <link rel="stylesheet" href="/css/chrome.css" />
  <link rel="stylesheet" href="/css/panels.css" />
  <link rel="stylesheet" href="/css/drawing.css" />
  <link rel="stylesheet" href="/css/colorpicker.css" />
  <link rel="stylesheet" href="/css/controls.css" />
  <link rel="stylesheet" href="/css/chart-pane.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/dialogs.css" />
  <link rel="stylesheet" href="/css/settings.css" />
  <link rel="stylesheet" href="/css/modals.css" />
  <link rel="stylesheet" href="/css/surfaces.css" />
</head>
<body>
  <script>
    // Surface a failed boot instead of a black window: show the error on the page.
    (function () {
      function show(msg) {
        var d = document.getElementById('boot-error');
        if (!d) { d = document.createElement('pre'); d.id = 'boot-error';
          d.style.cssText = 'position:fixed;inset:0;margin:0;padding:18px;background:#15171b;color:#ff6b6b;font:12px/1.5 monospace;white-space:pre-wrap;overflow:auto;z-index:99999';
          (document.body || document.documentElement).appendChild(d); }
        d.textContent += msg + '\n\n';
      }
      // "ResizeObserver loop …" is a benign Chromium warning (fires on resize/maximize); ignore it.
      window.addEventListener('error', function (e) {
        if (e.message && e.message.indexOf('ResizeObserver loop') !== -1) return;
        show((e.message || 'error') + (e.filename ? '\n  at ' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('Unhandled rejection: ' + ((r && (r.stack || r.message)) || r)); });
    })();
  </script>
  <div id="tabbar"></div>
  <div id="strip">
    <input id="sym" value="EP" title="CQG symbol — EP = E-mini S&P. Edit if rejected (e.g. EPU6, F.US.EP)" data-i18n-title="CQG symbol — EP = E-mini S&P. Edit if rejected (e.g. EPU6, F.US.EP)" />
    <button id="btnCompare" class="strip-btn" title="Compare symbol (adds a sub-pane below)" data-i18n-title="Compare symbol (adds a sub-pane below)"><img class="strip-ico" src="/images/compare.png" alt="Compare"></button>
    <span class="sep"></span>
    <div id="tfbar"><!-- favorite TF buttons injected by JS --></div>
    <button id="tfAdd" title="Add / manage timeframes" data-i18n-title="Add / manage timeframes">+</button>
    <span class="sep"></span>
    <button id="btnCandles" class="strip-btn" title="Chart type" data-i18n-title="Chart type"><img class="strip-ico" src="/images/candle.png" alt="Chart type"></button>
    <span class="sep"></span>
    <button id="btnStudies" class="strip-btn" title="Studies" data-i18n-title="Studies"><img class="strip-ico" src="/images/function.png" alt="Studies"></button>
    <button id="btnStudyTpl" class="strip-btn" title="Indicator templates" data-i18n-title="Indicator templates"><img class="strip-ico" src="/images/template.png" alt="Indicator templates"></button>
    <button id="btnAddons" class="strip-btn" title="Addons" data-i18n-title="Addons"><img class="strip-ico" src="/images/addons.png" alt=""></button>
    <span class="sep"></span>
    <button id="btnUndo" class="strip-btn" title="Undo (Ctrl+Z)" data-i18n-title="Undo (Ctrl+Z)" disabled><img class="strip-ico" src="/images/undo.png" alt="Undo"></button>
    <button id="btnRedo" class="strip-btn" title="Redo (Ctrl+Shift+Z)" data-i18n-title="Redo (Ctrl+Shift+Z)" disabled><img class="strip-ico" src="/images/redo.png" alt="Redo"></button>
    <span class="sep"></span>
    <button id="btnAutoScroll" class="strip-btn" title="Auto-scroll to the latest bar" data-i18n-title="Auto-scroll to the latest bar"><img class="strip-ico" src="/images/arrow-right-to-line.png" alt="Auto-scroll"></button>
    <button id="btnShiftEnd" class="strip-btn" title="Shift end of chart from right border" data-i18n-title="Shift end of chart from right border"><img class="strip-ico" src="/images/arrow-left-to-line.png" alt="Shift end"></button>
    <span class="sep"></span>
    <button id="btnChartOrder" class="strip-btn" title="Order — open the order ticket on this chart's broker + symbol" data-i18n-title="Order — open the order ticket on this chart's broker + symbol"><span data-i18n="Order">Order</span></button>
    <div class="spacer"></div>
    <button id="btnLayout" class="strip-btn" title="Layout" data-i18n-title="Layout"><span class="layout-icon"></span></button>
    <button id="btnSaved" class="strip-btn" title="Saved layouts" data-i18n-title="Saved layouts"><span id="layoutName">Untitled</span><span class="caret">▾</span></button>
    <span class="sep"></span>
    <span id="conn"></span>
    <span class="sep"></span>
    <button id="btnOpenConnect" class="strip-btn"><img class="strip-ico" src="/images/connect.png" alt=""><span data-i18n="Connect">Connect</span></button>
  </div>

  <div id="workarea">
    <div id="toolbar"></div>
    <div id="panes"></div>
    <div id="rightpanel"></div>
    <div id="rightrail"></div>
  </div>
  <div id="bottombar"></div>

  <!-- timeframe add/manage dropdown -->
  <div id="tfMenu"></div>

  <div id="studyTplMenu"></div>


  <!-- layout picker dropdown -->
  <div id="layoutMenu"></div>

  <!-- saved layouts dropdown -->
  <div id="savedMenu"></div>

  <!-- per-pane chart settings popover -->
  <div id="chartSettings"></div>

  <!-- right-click context menu -->
  <div id="chartContextMenu"></div>

  <!-- full chart settings dialog -->
  <div id="settingsDialog" class="modal">
    <div class="settings-dialog">
      <div class="sd-head"><h3>Settings</h3><button id="sd-close" class="sd-x">✕</button></div>
      <div class="sd-body">
        <div class="sd-nav" id="sd-nav"></div>
        <div class="sd-content" id="sd-content"></div>
      </div>
      <div class="sd-foot">
        <div class="sd-template">
          <button id="sd-tmpl-btn">Template ▾</button>
          <div id="sd-tmpl-menu"></div>
        </div>
        <div class="spacer"></div>
        <button id="sd-applyall">Apply to all</button>
        <button id="sd-cancel">Cancel</button>
        <button id="sd-ok" class="primary">Ok</button>
      </div>
    </div>
  </div>

  <!-- edit-layout modal -->
  <div id="layoutEditModal" class="modal">
    <div class="dialog">
      <h3>Rename layout</h3>
      <div class="row">
        <label>Name</label>
        <input id="le-name" autocomplete="off" />
      </div>
      <div class="dlg-actions">
        <button id="le-cancel">Cancel</button>
        <button id="le-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- connect modal -->
  <div id="modal" class="modal">
    <div class="dialog conn-dlg">
      <div class="conn-head"><span data-i18n="Connections">Connections</span><span id="connClose" class="lib-x">✕</span></div>

      <div class="conn-body">
        <!-- LEFT: Account Manager -- create / edit / save an account -->
        <div class="conn-col conn-form">
          <div class="conn-sec-title" data-i18n="Account">Account</div>
          <div class="row">
            <label data-i18n="Saved">Saved</label>
            <select id="f-saved"><option value="" data-i18n="— new account —">— new account —</option></select>
          </div>
          <div class="row">
            <label data-i18n="Name">Name</label>
            <input id="f-name" placeholder="e.g. My CQG demo" data-i18n-ph="e.g. My CQG demo" autocomplete="off" />
          </div>
          <!-- Protocol + Account type share a row (Account type hidden for non-trading adapters -> Protocol fills) -->
          <div class="row2">
            <div class="row">
              <label data-i18n="Protocol">Protocol</label>
              <select id="f-protocol"></select>
            </div>
            <!-- universal trading field: netting (one net position) vs hedging (individual positions). Gates features. -->
            <div class="row" id="f-accttype-row" style="display:none">
              <label data-i18n="Account type">Account type</label>
              <select id="f-accttype"><option value="netting" data-i18n="Netting">Netting</option><option value="hedging" data-i18n="Hedging">Hedging</option></select>
            </div>
          </div>
          <!-- Starting balance + History-to-load share a row (both trading-only, shown/hidden together) -->
          <div class="row2">
            <!-- the account's known starting balance -- the origin for stats -->
            <div class="row" id="f-startbal-row" style="display:none">
              <label data-i18n="Starting balance">Starting balance</label>
              <input type="number" id="f-startbal" step="any" placeholder="e.g. 100000" data-i18n-ph="e.g. 100000" autocomplete="off" />
            </div>
            <!-- how many days of order history to pull on connect. Only bounds the seed -- smaller = faster
                 startup, larger = more history (brokers cap it, e.g. CQG ~30d). Default 30. -->
            <div class="row" id="f-histdays-row" style="display:none">
              <label data-i18n="History to load (days)">History to load (days)</label>
              <input type="number" id="f-histdays" min="1" step="1" placeholder="30" autocomplete="off" />
            </div>
          </div>
          <!-- server + auth fields are rendered per-protocol by connect-dialog.js -->
          <div id="f-fields"></div>
          <label class="chk"><input type="checkbox" id="f-autoconnect" /> <span data-i18n="Auto-connect on startup">Auto-connect on startup</span></label>
          <div class="dlg-status" id="dlgStatus"></div>
          <div class="dlg-actions">
            <button id="btnAdaptersFolder" class="dlg-link" title="Open the adapters folder" data-i18n-title="Open the adapters folder">⊞ <span data-i18n="Open folder">Open folder</span></button>
            <button id="btnDelete" data-i18n="Delete">Delete</button>
            <button id="btnSave" class="primary" data-i18n="Save">Save</button>
          </div>
        </div>

        <!-- RIGHT: Connection Manager -- every saved account + status dot + connect/disconnect -->
        <div class="conn-col conn-connlist">
          <div class="conn-sec-title" data-i18n="Connections">Connections</div>
          <div id="conn-list" class="conn-list"></div>
          <div class="dlg-actions conn-close-row">
            <button id="btnCancel" data-i18n="Close">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- self-hosted libs (classic scripts → expose globals) -->
  <script src="lib/protobuf.min.js"></script>
  <!-- app: native ES modules, no build step. Chart engine = kapelka (the de-Vue vanilla port of
       trading-vue-js), imported directly from source (lib/kapelka/) by pane.js/host.js. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
